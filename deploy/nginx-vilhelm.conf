# ============================================================
# 莫弈·Vilhelm 成长时间线站 — Nginx 静态托管配置
# 适用：Windows Nginx / Linux Nginx（路径按平台改）
# 用法见：deploy/部署说明.md
# ============================================================

server {
    listen 80;
    server_name localhost;            # 改成你的域名或服务器 IP

    # ---------- 站点根目录 ----------
    # Windows：直接指向项目目录（改动即生效）；或复制到 Nginx html 目录后改这里
    root  E:/Project/Vilhelm;
    # Linux 示例：root /var/www/vilhelm;
    index index.html;

    charset utf-8;

    # ---------- 缓存策略 ----------
    # 静态资源（带版本号 ?v=，可放心长缓存）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 数据文件不缓存（改 events.json 等立即生效）
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # ---------- 页面路由 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
